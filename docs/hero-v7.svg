<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF6900"/>
      <stop offset="1" stop-color="#e55d00"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <circle cx="200" cy="100" r="200" fill="#FF6900" opacity="0.06" filter="url(#blur1)"/>
  <circle cx="1000" cy="400" r="180" fill="#FF6900" opacity="0.04" filter="url(#blur2)"/>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>
  </g>

  <!-- Left: Logo + Title -->
  <g>
    <!-- Logo block -->
    <rect x="80" y="140" width="72" height="72" rx="18" fill="url(#accent)"/>
    <text x="116" y="192" text-anchor="middle" fill="#000" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800">I</text>

    <!-- Title -->
    <text x="180" y="178" fill="#f0f0f0" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">icicle</text>
    <text x="180" y="210" fill="#666" font-family="system-ui, -apple-system, sans-serif" font-size="16" letter-spacing="3" font-weight="500">STORAGE ORCHESTRATION COCKPIT</text>

    <!-- Subtitle -->
    <text x="80" y="280" fill="#888" font-family="system-ui, -apple-system, sans-serif" font-size="18" line-height="1.6">Find what's eating your disk. Queue safe actions.</text>
    <text x="80" y="310" fill="#888" font-family="system-ui, -apple-system, sans-serif" font-size="18">Automate the rest.</text>

    <!-- Badges -->
    <rect x="80" y="350" width="96" height="28" rx="14" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="128" y="369" text-anchor="middle" fill="#888" font-family="system-ui, sans-serif" font-size="11">Go 1.22+</text>

    <rect x="186" y="350" width="72" height="28" rx="14" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="222" y="369" text-anchor="middle" fill="#888" font-family="system-ui, sans-serif" font-size="11">Wails</text>

    <rect x="268" y="350" width="72" height="28" rx="14" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="304" y="369" text-anchor="middle" fill="#888" font-family="system-ui, sans-serif" font-size="11">MIT</text>
  </g>

  <!-- Right: Abstract UI mockup -->
  <g opacity="0.7">
    <!-- Window frame -->
    <rect x="620" y="80" width="500" height="340" rx="16" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/>

    <!-- Window title bar -->
    <rect x="620" y="80" width="500" height="36" rx="16" fill="#1a1a1a"/>
    <rect x="620" y="100" width="500" height="16" fill="#1a1a1a"/>

    <!-- Traffic lights -->
    <circle cx="644" cy="98" r="5" fill="#333"/>
    <circle cx="660" cy="98" r="5" fill="#333"/>
    <circle cx="676" cy="98" r="5" fill="#333"/>

    <!-- Sidebar -->
    <rect x="620" y="116" width="100" height="304" fill="#111" stroke-right="#2a2a2a"/>
    <line x1="720" y1="116" x2="720" y2="420" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Sidebar items -->
    <rect x="634" y="136" width="72" height="28" rx="8" fill="#FF6900" opacity="0.9"/>
    <text x="670" y="155" text-anchor="middle" fill="#000" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Dashboard</text>

    <rect x="634" y="172" width="72" height="28" rx="8" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="670" y="191" text-anchor="middle" fill="#666" font-family="system-ui, sans-serif" font-size="10">Analyze</text>

    <rect x="634" y="208" width="72" height="28" rx="8" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="670" y="227" text-anchor="middle" fill="#666" font-family="system-ui, sans-serif" font-size="10">Automation</text>

    <!-- Drive bars -->
    <rect x="740" y="136" width="150" height="80" rx="10" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="756" y="160" fill="#f0f0f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">C:</text>
    <text x="872" y="160" text-anchor="end" fill="#666" font-family="monospace" font-size="12">67%</text>
    <rect x="756" y="172" width="118" height="6" rx="3" fill="#222"/>
    <rect x="756" y="172" width="79" height="6" rx="3" fill="#FF6900"/>

    <rect x="900" y="136" width="150" height="80" rx="10" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="916" y="160" fill="#f0f0f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">D:</text>
    <text x="1032" y="160" text-anchor="end" fill="#666" font-family="monospace" font-size="12">42%</text>
    <rect x="916" y="172" width="118" height="6" rx="3" fill="#222"/>
    <rect x="916" y="172" width="50" height="6" rx="3" fill="#FF6900"/>

    <!-- Heavy file table mockup -->
    <rect x="740" y="232" width="310" height="172" rx="10" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="756" y="256" fill="#FF6900" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1.5">HEAVY FILES</text>

    <!-- Table header -->
    <rect x="756" y="268" width="278" height="20" rx="4" fill="#222"/>
    <text x="764" y="282" fill="#666" font-family="monospace" font-size="9">SIZE</text>
    <text x="860" y="282" fill="#666" font-family="monospace" font-size="9">FILE</text>
    <text x="1000" y="282" fill="#666" font-family="monospace" font-size="9">ACTION</text>

    <!-- Table rows -->
    <rect x="756" y="296" width="278" height="22" rx="3" fill="#141414"/>
    <text x="764" y="311" fill="#f0f0f0" font-family="monospace" font-size="10">2.1 GB</text>
    <text x="860" y="311" fill="#888" font-family="monospace" font-size="9">release-v3.2.iso</text>
    <rect x="1000" y="300" width="30" height="14" rx="3" fill="#2a2a2a"/>

    <rect x="756" y="322" width="278" height="22" rx="3" fill="#141414"/>
    <text x="764" y="337" fill="#f0f0f0" font-family="monospace" font-size="10">1.8 GB</text>
    <text x="860" y="337" fill="#888" font-family="monospace" font-size="9">backup-2024.tar.gz</text>
    <rect x="1000" y="326" width="30" height="14" rx="3" fill="#2a2a2a"/>

    <rect x="756" y="348" width="278" height="22" rx="3" fill="#141414"/>
    <text x="764" y="363" fill="#f0f0f0" font-family="monospace" font-size="10">960 MB</text>
    <text x="860" y="363" fill="#888" font-family="monospace" font-size="9">node_modules.zip</text>
    <rect x="1000" y="352" width="30" height="14" rx="3" fill="#2a2a2a"/>

    <rect x="756" y="374" width="278" height="22" rx="3" fill="#141414"/>
    <text x="764" y="389" fill="#f0f0f0" font-family="monospace" font-size="10">640 MB</text>
    <text x="860" y="389" fill="#888" font-family="monospace" font-size="9">old_vm.vmdk</text>
    <rect x="1000" y="378" width="30" height="14" rx="3" fill="#2a2a2a"/>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="470" text-anchor="middle" fill="#444" font-family="system-ui, sans-serif" font-size="13" letter-spacing="0.5">Windows-first · Fast Go scanner · Native desktop · Safe cleanup</text>
</svg>
